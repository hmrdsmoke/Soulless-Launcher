[workspace]
resolver = "2"
members = [
    "organizer",
    "launcher",
    "applet",
]
exclude = [
    "vendor/cosmic-panel-config",
    "vendor/xdg-shell-wrapper-config",
]

# ===========================================================================
# Shared dependency versions — single source of truth for the whole workspace.
# Update here and it propagates to all crates. :: MRV
# ===========================================================================

[workspace.package]
version      = "0.1.1"
edition      = "2024"
authors      = ["Michael Van Auker (HMRDSmoke)"]
license      = "GPL-3.0-or-later"
repository   = "https://github.com/hmrdsmoke/soulless-launcher"
homepage     = "https://github.com/hmrdsmoke/soulless-launcher"
readme       = "README.md"

[workspace.dependencies]
# ── UI framework ─────────────────────────────────────────────────────────────
cosmic = { git = "https://github.com/pop-os/libcosmic", rev = "4657b6a7259e6ecdbf0af6f956de163e3d49dc1a", package = "libcosmic", features = [
    "tokio",
    "wayland",
    "winit",
    "wgpu",           # for launcher performance
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
] }

# ── Search ────────────────────────────────────────────────────────────────────
nucleo-matcher = "0.3.1"                    # pinned exact :: MRV

# ── Desktop integration ───────────────────────────────────────────────────────
freedesktop-desktop-entry = "0.6.2"         # pinned exact :: MRV
dirs = "5.0.1"                              # pinned exact :: MRV

# ── Serialization ─────────────────────────────────────────────────────────────
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"
ron         = "0.8"
uuid        = { version = "1", features = ["v4"] }
bincode     = "1.3.3"

# ── System monitoring ─────────────────────────────────────────────────────────
sysinfo      = "0.39.2"
nvml-wrapper = "0.10"                       # NVIDIA GPU stats :: MRV

# ── Graphics ──────────────────────────────────────────────────────────────────
resvg       = "0.44.0"
tiny-skia   = "0.11.4"

# ── Vault security ────────────────────────────────────────────────────────────
argon2          = "0.5.3"
chacha20poly1305 = "0.10.0"
rand            = "0.8.5"
secrecy         = "0.8.0"
zeroize         = "1.8.1"

# ── Utilities ─────────────────────────────────────────────────────────────────
fs2              = "0.4.3"                  # pinned exact :: MRV
once_cell        = "1.19.0"
notify           = "8.2.0"
percent-encoding = "2.0.0"

# ── Applet ────────────────────────────────────────────────────────────────────
futures-util  = "0.3.31"
i18n-embed-fl = "0.10"
rust-embed    = "8.7.2"
tokio         = { version = "1.48.0", features = ["full"] }

[workspace.dependencies.i18n-embed]
version  = "0.16"
features = ["fluent-system", "desktop-requester"]

# ===========================================================================
# RELEASE PROFILE — shipped binary, fully optimized and stripped :: MRV
# Use: cargo build --release
# ===========================================================================
[profile.release]
lto           = "fat"
codegen-units = 1
opt-level     = 3
panic         = "abort"
strip         = true

# ===========================================================================
# PROFILING — release speed, debug symbols intact :: MRV
# Use: cargo build --profile profiling
#      cargo flamegraph --profile profiling --bin soulless-launcher
# ===========================================================================
[profile.profiling]
inherits = "release"
strip    = false
debug    = true
lto      = "thin"

# ===========================================================================
# DEV RELEASE — fast compile, no LTO, for day-to-day testing :: MRV
# Use: cargo build --profile dev-release
# ===========================================================================
[profile.dev-release]
inherits      = "release"
lto           = "thin"
codegen-units = 4
strip         = false
debug         = false

# Override the cosmic-panel git source (bare, unpinnable for offline flatpak
# vendoring) with our vendored copies — see vendor/cosmic-panel-config/Cargo.toml
[patch.'https://github.com/pop-os/cosmic-panel']
cosmic-panel-config = { path = "vendor/cosmic-panel-config" }
xdg-shell-wrapper-config = { path = "vendor/xdg-shell-wrapper-config" }
